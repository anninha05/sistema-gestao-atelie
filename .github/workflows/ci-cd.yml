name: CI/CD Pipeline - Atelie

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 🛠️ Build & Testes (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}   
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: atelie_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Fazer o checkout do código
        uses: actions/checkout@v5

      - name: ☕ Configurar o Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: 🛡️ Dar permissão de execução ao Maven
        run: chmod +x mvnw

      - name: 🏗️ Compilar o projeto e rodar testes
        run: ./mvnw clean verify