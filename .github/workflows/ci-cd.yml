name: CI/CD Pipeline - Atelie

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 🛠️ Build & Testes (Java 21)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Fazer o checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🛡️ Dar permissão de execução ao Maven
        run: chmod +x mvnw

      - name: 🏗️ Compilar o projeto e rodar testes
        run: ./mvnw clean verify